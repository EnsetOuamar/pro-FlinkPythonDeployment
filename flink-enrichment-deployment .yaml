apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: flink-enrichment-job
  namespace: platine-traitement
spec:
  image: flink:1.20-scala_2.12-java17
  flinkVersion: v1_20
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "2"
    state.checkpoints.dir: file:///opt/flink/checkpoints
  serviceAccount: flink
  podTemplate:
    spec:
      initContainers:
        - name: install-pyflink
          image: python:3.10-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -ex
              # 1. Install PyFlink and Kafka client into shared volume
              pip install --prefix=/opt/flink/python-libs apache-flink kafka-python-ng

              # 2. Download Kafka connector JAR using Python's standard library (no curl needed)
              mkdir -p /opt/flink/usrlib
              python3 -c "import urllib.request; urllib.request.urlretrieve('https://repo1.maven.org/maven2/org/apache/flink/flink-sql-connector-kafka/3.1.0-1.18/flink-sql-connector-kafka-3.1.0-1.18.jar', '/opt/flink/usrlib/flink-sql-connector-kafka-3.1.0-1.18.jar')"
          volumeMounts:
            - name: shared-venv
              mountPath: /shared/venv
            - name: shared-jars
              mountPath: /shared/jars
      containers:
        - name: flink-main-container
          env:
            - name: PYTHONHOME
              value: /shared/venv
            - name: LD_LIBRARY_PATH
              value: /shared/venv/lib
          volumeMounts:
            - name: shared-venv
              mountPath: /shared/venv
            - name: shared-jars
              mountPath: /shared/jars
            - name: pyflink-scripts
              mountPath: /opt/flink/usrlib
      volumes:
        - name: shared-venv
          emptyDir: {}
        - name: shared-jars
          emptyDir: {}
        - name: pyflink-scripts
          configMap:
            name: flink-pyflink-scripts
  job:
    jarURI: local:///opt/flink/opt/flink-python_2.12-1.20.1.jar
    entryClass: org.apache.flink.client.python.PythonDriver
    args:
      - "-pyclientexec"
      - "/shared/venv/bin/python3"
      - "-py"
      - "/opt/flink/usrlib/enrichment_job.py"
    parallelism: 1
    upgradeMode: stateless
  jobManager:
    resource:
      memory: "1024m"
      cpu: 0.5
  taskManager:
    resource:
      memory: "1024m"
      cpu: 0.5
