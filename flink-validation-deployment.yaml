apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: flink-validation-job
  namespace: platine-traitement
spec:
  image: flink:1.20-scala_2.12-java17
  flinkVersion: v1_20
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "2"
    state.checkpoints.dir: file:///opt/flink/checkpoints
  serviceAccount: flink
  podTemplate:
    spec:
      initContainers:
        - name: install-pyflink
          image: python:3.10-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -ex
              # 1. Install PyFlink into shared directory using --prefix
              pip install --prefix=/opt/flink/python-libs apache-flink kafka-python-ng

              # 2. Download Kafka connector JAR using Python (no curl/wget dependency required)
              mkdir -p /opt/flink/usrlib
              python3 -c "import urllib.request; urllib.request.urlretrieve('https://repo1.maven.org/maven2/org/apache/flink/flink-sql-connector-kafka/3.1.0-1.18/flink-sql-connector-kafka-3.1.0-1.18.jar', '/opt/flink/usrlib/flink-sql-connector-kafka-3.1.0-1.18.jar')"
          volumeMounts:
            - name: python-libs
              mountPath: /opt/flink/python-libs
            - name: flink-usrlib
              mountPath: /opt/flink/usrlib
      containers:
        - name: flink-main-container
          env:
            - name: PYTHONPATH
              value: "/opt/flink/python-libs/lib/python3.10/site-packages"
          volumeMounts:
            - name: python-libs
              mountPath: /opt/flink/python-libs
            - name: flink-usrlib
              mountPath: /opt/flink/usrlib
            - name: pyflink-scripts
              mountPath: /opt/flink/scripts
      volumes:
        - name: python-libs
          emptyDir: {}
        - name: flink-usrlib
          emptyDir: {}
        - name: pyflink-scripts
          configMap:
            name: flink-pyflink-scripts
  job:
    jarURI: local:///opt/flink/opt/flink-python_2.12-1.20.1.jar
    entryClass: org.apache.flink.client.python.PythonDriver
    args:
      - "-pyclientexec"
      - "python3"
      - "-py"
      - "/opt/flink/scripts/validation_job.py"
    parallelism: 1
    upgradeMode: stateless
  jobManager:
    resource:
      memory: "1024m"
      cpu: 0.5
  taskManager:
    resource:
      memory: "1024m"
      cpu: 0.5
