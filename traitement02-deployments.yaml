    metadata:
      labels:
        app: flink-enrichment-job
    spec:
      containers:
      - name: enricher
        image: python:3.10-slim
        command: ["/bin/sh", "-c"]
        args:
          - pip install kafka-python-ng && python /app/enrichment.py
        volumeMounts:
        - name: script-vol
          mountPath: /app
      volumes:
      - name: script-vol
