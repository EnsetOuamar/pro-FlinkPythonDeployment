apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: flink-enrichment-job
  namespace: platine-traitement
spec:
  image: flink:1.20-scala_2.12-java17
  flinkVersion: v1_20
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "2"
    state.checkpoints.dir: file:///opt/flink/checkpoints
  serviceAccount: flink
  podTemplate:
    spec:
      initContainers:
        - name: pyflink-bootstrap
          image: flink:1.20-scala_2.12-java17
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              apt-get update
              apt-get install -y --no-install-recommends python3 python3-venv python3-pip curl
              python3 -m venv --copies /shared/venv
              /shared/venv/bin/pip install --no-cache-dir apache-flink==1.20.1
              mkdir -p /shared/venv/sharedlibs
              cp /usr/lib/x86_64-linux-gnu/libpython3*.so* /shared/venv/sharedlibs/ 2>/dev/null || true
              curl -fL -o /shared/jars/flink-sql-connector-kafka.jar \
                https://repo.maven.apache.org/maven2/org/apache/flink/flink-sql-connector-kafka/3.2.0-1.19/flink-sql-connector-kafka-3.2.0-1.19.jar
          volumeMounts:
            - name: shared-venv
              mountPath: /shared/venv
            - name: shared-jars
              mountPath: /shared/jars
      containers:
        - name: flink-main-container
          env:
            - name: LD_LIBRARY_PATH
              value: /shared/venv/sharedlibs
          volumeMounts:
            - name: shared-venv
              mountPath: /shared/venv
            - name: shared-jars
              mountPath: /shared/jars
            - name: pyflink-scripts
              mountPath: /opt/flink/usrlib
      volumes:
        - name: shared-venv
          emptyDir: {}
        - name: shared-jars
          emptyDir: {}
        - name: pyflink-scripts
          configMap:
            name: flink-pyflink-scripts
  job:
    jarURI: local:///opt/flink/opt/flink-python_2.12-1.20.1.jar
    entryClass: org.apache.flink.client.python.PythonDriver
    args:
      - "-pyclientexec"
      - "/shared/venv/bin/python3"
      - "-py"
      - "/opt/flink/usrlib/enrichment_job.py"
    parallelism: 1
    upgradeMode: stateless
  jobManager:
    resource:
      memory: "1024m"
      cpu: 0.5
  taskManager:
    resource:
      memory: "1024m"
      cpu: 0.5
